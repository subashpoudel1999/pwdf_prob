name: fire_webapp4
description: "MHRI Fusion module — post-wildfire debris-flow hazard fused into the ASBPA Multi-Hazard Resilience Index."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.3.0
  file_picker: ^6.0.0    # lets the user pick a .geojson/.zip AOI file to upload

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
